[options]
# Rutas de addons.
#   /mnt/repo-addons  = repo odoo-custom-addons (montado read-only, módulos en la raíz)
#   /mnt/extra-addons = scratch local para módulos ad-hoc
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/repo-addons

# Configuración básica
data_dir = /var/lib/odoo
list_db = True
admin_passwd = admin
# Solo se ve la DB de este stack en el gestor / login.
dbfilter = ^odoo_custom$

# Logging para desarrollo (a stdout → `docker logs odoo-custom`)
log_level = info
log_handler = :INFO,werkzeug:WARNING,odoo.addons.queue_job:INFO
logfile = False
log_db = False

# Base de datos (servicio compose "postgres" dentro de la red del stack)
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_custom
db_template = template0

# Servidor (puertos INTERNOS del contenedor; el mapeo al host va en el compose)
xmlrpc_port = 8069
longpolling_port = 8072
# Acceso directo por puerto (sin proxy/traefik delante).
proxy_mode = False

# Multi-worker: necesario para que el runner de queue_job (OCA) despache jobs.
# Para breakpoints con debugpy usa `./dev.sh custom debug` (usa workers=0).
workers = 4
max_cron_threads = 2

# Límites relajados para desarrollo
limit_memory_hard = 4294967296
limit_memory_soft = 3221225472
limit_time_cpu = 300
limit_time_real = 600

# Sin datos demo
without_demo = all

# Módulos de arranque. queue_job DEBE ir aquí para que el JobRunner arranque
# junto con el servidor (el módulo está vendorizado en odoo-custom-addons).
server_wide_modules = base,web,queue_job

# =============================================================================
# Queue Jobs (OCA queue_job) — procesamiento asíncrono multi-worker.
# Requiere workers>0 (arriba) + queue_job en server_wide_modules.
# Canales según los que usan los módulos del repo; cualquier subcanal no
# listado hereda la capacidad de su padre (p.ej. root.mercado.combined_orders
# cae en root.mercado).
# =============================================================================
[queue_job]
channels = root:2, root.envios:1, root.intercompany:1, root.mercado:2, root.twonary_mercado:1, root.typesense:2, root.product_search:1, root.search_autocomplete:1

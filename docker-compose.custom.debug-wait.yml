# Override de DEBUG (espera cliente) para el stack custom (repo odoo-custom-addons).
# Monta odoo.custom.debug.conf (workers=0, sin queue_job). Odoo NO arranca hasta
# que conectes el debugger de VS Code a localhost:5778.
services:
  odoo:
    command: ["odoo", "debug-wait", "--dev=all"]
    volumes:
      - ./odoo.custom.debug.conf:/etc/odoo/odoo.conf:ro

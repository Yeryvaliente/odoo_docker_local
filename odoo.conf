[options]
# Rutas de addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/repo-addons

# Configuración básica
data_dir = /var/lib/odoo
list_db = True
admin_passwd = admin

# Configuración de logging para desarrollo
log_level = debug
log_handler = :DEBUG,werkzeug:WARNING,odoo.service.common:INFO
logfile = False
log_db = False
log_db_level = warning

# Configuración de base de datos
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_18
db_template = template0

# Configuración de rendimiento para desarrollo (single process)
workers = 0
max_cron_threads = 1

# Configuración de límites relajados para desarrollo
limit_memory_hard = 4294967296
limit_memory_soft = 3221225472
limit_request = 16384
limit_time_cpu = 300
limit_time_real = 600

# Configuración de servidor
xmlrpc_port = 8069
longpolling_port = 8072
proxy_mode = True

# Desarrollo y debugging
debug_mode = True
dev_mode = reload,qweb,werkzeug,xml
debug_port = 5678

# GeoIP
geoip_city_db = /usr/share/GeoIP/GeoLite2-City.mmdb

# Sin datos demo por defecto
without_demo = all
demo = False

# Configuración de email para desarrollo (usa archivo local)
email_from = odoo-dev@localhost.com
smtp_server = localhost
smtp_port = 1025
smtp_ssl = False
smtp_user = False
smtp_password = False

# Módulos del servidor que se cargan al inicio
server_wide_modules = base,web,queue_job

# Configuración de sesiones
session_store = odoo.addons.base.models.ir_session.FilesystemSessionStore

# Configuración de Valkey/Redis para cache (ormcache_redis_gt)
redis_cache_uri = redis://valkey:6379/1
redis_cache_prefix = cache:
redis_cache_expiration = 360

# Configuración de traducción
translate_modules = ['all']

# Configuración de cache deshabilitada para desarrollo
enable_cache = False

# Para debugging con VS Code
# debug_port = 5678

# NORMAL MODE: QUEUE_JOB ENABLED
# En modo normal ejecutamos workers de queue_job para procesamiento asíncrono
[queue_job]
channels = root:2
# Configuración adicional para queue_job
port = 8069
host = 0.0.0.0

# Configuraciones comentadas que puedes habilitar según necesites

# Para habilitar Sentry en desarrollo
# [sentry]
# dsn = your_sentry_dsn_here
# enabled = false
# traces_sample_rate = 0.1
# logging_level = warning
# exclude_loggers = werkzeug
# environment = development

# Para configuración HTTPS en desarrollo
# xmlrpcs = True
# xmlrpcs_port = 8071
# xmlrpcs_interface = 0.0.0.0

# Para configuración de multiprocessing cuando sea necesario
# workers = 4
# longpolling_port = 8072
# max_cron_threads = 2

# Para limitar bases de datos visibles
# dbfilter = ^odoo_dev.*$

# Para configuración de correo con servidor SMTP real
# smtp_server = smtp.gmail.com
# smtp_port = 587
# smtp_ssl = True
# smtp_user = your_email@gmail.com
# smtp_password = your_app_password
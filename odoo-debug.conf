[options]
# Rutas de addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/repo-addons

# Configuración básica
data_dir = /var/lib/odoo
list_db = True
admin_passwd = admin

# Configuración de logging para desarrollo
log_level = debug
log_handler = :DEBUG,werkzeug:WARNING,odoo.service.common:INFO
logfile = False
log_db = False
log_db_level = warning

# Configuración de base de datos
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_18
db_template = template0

# Configuración de rendimiento para desarrollo (single process)
workers = 0
max_cron_threads = 1

# Configuración de límites relajados para desarrollo
limit_memory_hard = 4294967296
limit_memory_soft = 3221225472
limit_request = 16384
limit_time_cpu = 300
limit_time_real = 600

# Configuración de servidor
xmlrpc_port = 8069
longpolling_port = 8072
proxy_mode = True

# Desarrollo y debugging
debug_mode = True
dev_mode = reload,qweb,werkzeug,xml

# GeoIP
geoip_city_db = /usr/share/GeoIP/GeoLite2-City.mmdb

# Sin datos demo por defecto
without_demo = all
demo = False

# Configuración de email para desarrollo (usa archivo local)
email_from = odoo-dev@localhost.com
smtp_server = localhost
smtp_port = 1025
smtp_ssl = False
smtp_user = False
smtp_password = False

# Módulos del servidor que se cargan al inicio
server_wide_modules = base,web

# Configuración de sesiones
session_store = odoo.addons.base.models.ir_session.FilesystemSessionStore

# Configuración de traducción
translate_modules = ['all']

# Configuración de cache deshabilitada para desarrollo
enable_cache = False

# DEBUG MODE: NO QUEUE_JOB WORKERS
# En modo debug NO ejecutamos workers de queue_job para evitar
# interferencia con el debugging y threading issues

# Para debugging con VS Code
# debug_port = 5678

# NO incluir [queue_job] section en modo debug
# Los jobs se ejecutarán de forma síncrona/inmediata
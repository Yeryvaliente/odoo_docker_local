[options]
# Config de DEBUG del stack custom — single process para breakpoints (debugpy).
# Difiere de odoo.custom.conf SOLO en: workers=0 y sin runner de queue_job.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/repo-addons

data_dir = /var/lib/odoo
list_db = True
admin_passwd = admin
# Solo se ve la DB de este stack en el gestor / login.
dbfilter = ^odoo_custom$

log_level = info
log_handler = :INFO,werkzeug:WARNING
logfile = False
log_db = False

db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_custom
db_template = template0

xmlrpc_port = 8069
longpolling_port = 8072
proxy_mode = False

# Single process: debugpy NO funciona con workers>0.
workers = 0
max_cron_threads = 1

limit_memory_hard = 4294967296
limit_memory_soft = 3221225472
limit_time_cpu = 300
limit_time_real = 600

without_demo = all

# SIN queue_job en server_wide_modules → no arranca el runner; los jobs quedan
# 'pending' (no se despachan solos). Es el trade-off para poder depurar.
server_wide_modules = base,web

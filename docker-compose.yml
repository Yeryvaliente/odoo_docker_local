services:
  postgres:
    container_name: odoo-dev-postgres
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=odoo_18
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    restart: unless-stopped
    ports:
      - "5432:5432"  # Puerto expuesto para debugging
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: >
      postgres -c logging_collector=on
               -c log_destination=stderr
               -c log_statement=all
               -c log_duration=on
               -c log_min_duration_statement=0
               -c shared_preload_libraries='pg_stat_statements'
    networks:
      - odoo-dev-network

  valkey:
    container_name: odoo-dev-valkey
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    networks:
      - odoo-dev-network

  odoo:
    container_name: odoo-dev
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      - postgres
      - valkey
    ports:
      - "8069:8069"  # Puerto principal expuesto para debugging
      - "8072:8072"  # Puerto websocket expuesto
      - "5678:5678"  # Puerto de debugging Python
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
      - PGDATABASE=odoo_18
      - ODOO_RC=/etc/odoo/odoo.conf
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - VALKEY_HOST=valkey
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./extra-addons:/mnt/extra-addons
      - ./logs:/var/log/odoo
      - ../Odoocker/extra-addons:/mnt/repo-addons:ro  # Módulos del repositorio solo lectura
    restart: unless-stopped
    stdin_open: true  # Para debugging interactivo
    tty: true
    command: ["odoo"]  # Modo normal por defecto
    networks:
      - odoo-dev-network

  ngrok:
    container_name: odoo-dev-ngrok
    image: ngrok/ngrok:latest
    depends_on:
      - odoo
    ports:
      - "4040:4040"  # Puerto web de ngrok para ver los tunnels
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTH_TOKEN}  # Token de autenticación de ngrok
    command: http odoo:8069 --log=stdout --log-format=logfmt
    networks:
      - odoo-dev-network
    profiles:
      - tools  # Solo se ejecuta con --profile tools
  pgadmin:
    container_name: odoo-dev-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@localhost.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - odoo-dev-network
    profiles:
      - tools  # Solo se ejecuta con --profile tools

volumes:
  postgres_data:
  odoo_data:
  valkey_data:
  pgadmin_data:

networks:
  odoo-dev-network:
    driver: bridge